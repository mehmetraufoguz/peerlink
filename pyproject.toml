[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "peerlink"
version = "0.3.0"
description = "Claude Code oturumlarını LAN üzerinden birbirine bağlayan relay (uzak oturumlar yerel peer gibi görünür)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Mehmet Rauf Oğuz" }]
keywords = ["claude-code", "agents", "relay", "lan", "cross-session"]
dependencies = []

[project.scripts]
peerlink = "peerlink.relay:main"

[tool.setuptools]
packages = ["peerlink"]
